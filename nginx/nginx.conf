# Photogiraffe Nginx reverse proxy — v6.5 production hardening
#
# Rate-limit zones:
#   auth_limit  — strict: 5 req/min per IP for auth endpoints
#   api_limit   — moderate: 60 req/min per IP for general API
#   general     — loose: 120 req/min per IP for static assets

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ─── Rate-limit zones ────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=auth_limit:10m    rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m     rate=60r/m;
    limit_req_zone $binary_remote_addr zone=general:10m       rate=120r/m;

    # Default error response for rate-limit breaches
    limit_req_status 429;

    # ─── Logging ─────────────────────────────────────────────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log   warn;

    # ─── Compression ─────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    sendfile on;
    keepalive_timeout 65;

    # ─── Upstreams ───────────────────────────────────────────────────────────
    upstream frontend {
        server frontend:3000;
    }

    upstream go_core {
        server go-core:8080;
    }

    # ─── Main server block ───────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        client_max_body_size 110m;

        # Security headers
        add_header X-Frame-Options       SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy       strict-origin-when-cross-origin;

        # ── Auth endpoints (strict rate limit) ───────────────────────────────
        location ~ ^/api/auth/(login|register|refresh) {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass         http://go_core;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── SSE real-time stream (no buffering, long timeout) ─────────────────
        location /api/events/ {
            proxy_pass              http://go_core;
            proxy_set_header        Host              $host;
            proxy_set_header        X-Real-IP         $remote_addr;
            proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;
            proxy_http_version      1.1;
            proxy_set_header        Connection '';   # disable keep-alive upgrade for SSE
            proxy_buffering         off;             # critical for SSE
            proxy_cache             off;
            proxy_read_timeout      3600s;           # keep SSE open for 1 hour
            chunked_transfer_encoding on;
        }

        # ── Go Core API ───────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass         http://go_core;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # ── Public share endpoint ─────────────────────────────────────────────
        location /share/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass         http://go_core;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Health check ──────────────────────────────────────────────────────
        location /health {
            proxy_pass         http://go_core;
            proxy_set_header   Host $host;
        }

        # ── Next.js frontend (catch-all) ──────────────────────────────────────
        location / {
            limit_req zone=general burst=30 nodelay;
            proxy_pass         http://frontend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_read_timeout 60s;
        }
    }
}
