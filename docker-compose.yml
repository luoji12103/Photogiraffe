version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: photogiraffe-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-photogiraffe}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: photogiraffe-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispass}
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: photogiraffe-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-admin12345}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    restart: unless-stopped

  go-core:
    build:
      context: ./go-core
    container_name: photogiraffe-go-core
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-photogiraffe}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redispass}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_USER:-admin}
      - MINIO_SECRET_KEY=${MINIO_PASSWORD:-admin12345}
    depends_on:
      - postgres
      - redis
      - minio
    restart: unless-stopped

  python-worker:
    build:
      context: ./python-worker
    container_name: photogiraffe-python-worker
    environment:
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redispass}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_USER:-admin}
      - MINIO_SECRET_KEY=${MINIO_PASSWORD:-admin12345}
    depends_on:
      - redis
      - minio
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: photogiraffe-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_MINIO_URL=http://localhost:9000
    depends_on:
      - go-core
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata: